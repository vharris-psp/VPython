# Generated by VT. vt-library-release/v1
name: Release library

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify pyproject version matches the release tag
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]

      - name: Test source and project commands
        shell: bash
        run: |
          [[ "$(git -C .vt/sdk rev-parse HEAD)" == "fd5293bb88bc9b701a2a2244ecc75c0a92d9a74c" ]]
          [[ "$(git -C .vt/sdk rev-parse HEAD)" == "$(git rev-parse HEAD:.vt/sdk)" ]]
          python3 -m venv .venv
          .venv/bin/pip install --quiet build 'setuptools>=77' 'pytest>=8'
          sdk_dist="$RUNNER_TEMP/vt-project-sdk-${{ matrix.python-version }}"
          mkdir -p "$sdk_dist"
          .venv/bin/python -m build --no-isolation --wheel --outdir "$sdk_dist" .vt/sdk/python
          .venv/bin/pip install --quiet --no-index --no-build-isolation \
            --find-links "$sdk_dist" -e .
          .venv/bin/python -m pytest --junit-xml test-results.xml -q

  release:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build artifacts
        shell: bash
        run: |
          [[ "$(git -C .vt/sdk rev-parse HEAD)" == "fd5293bb88bc9b701a2a2244ecc75c0a92d9a74c" ]]
          [[ "$(git -C .vt/sdk rev-parse HEAD)" == "$(git rev-parse HEAD:.vt/sdk)" ]]
          python3 -m venv .venv
          .venv/bin/pip install --quiet build 'setuptools>=77'
          sdk_dist="$RUNNER_TEMP/vt-project-sdk-dist"
          mkdir -p "$sdk_dist"
          .venv/bin/python -m build --no-isolation --wheel --outdir "$sdk_dist" .vt/sdk/python
          .venv/bin/python -m build --no-isolation --outdir artifacts
          cd artifacts && sha256sum * > SHA256SUMS

      - name: Verify installed wheel
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/vpython-wheel"
          "$RUNNER_TEMP/vpython-wheel/bin/pip" install --quiet --no-index \
            --find-links "$RUNNER_TEMP/vt-project-sdk-dist" \
            --find-links artifacts \
            artifacts/vpython-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/vpython-wheel/bin/python" - "$GITHUB_WORKSPACE/pyproject.toml" <<'PY'
          import importlib
          import importlib.metadata
          import pathlib
          import sys
          import tomllib

          project = tomllib.loads(pathlib.Path(sys.argv[1]).read_text())
          metadata = project["project"]
          distribution = importlib.metadata.distribution(metadata["name"])
          assert distribution.version == metadata["version"]
          sdk_requirements = [
              requirement
              for requirement in (distribution.requires or [])
              if requirement.lower().startswith("vt-project-sdk")
          ]
          assert sdk_requirements == ["vt-project-sdk==1.9.0"]
          assert importlib.metadata.version("vt-project-sdk") == "1.9.0"
          importlib.import_module("vt_project_sdk")
          top_level = distribution.read_text("top_level.txt")
          assert top_level
          for module in top_level.splitlines():
              if module:
                  importlib.import_module(module)
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Published by VT from $GITHUB_SHA."
