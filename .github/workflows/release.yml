# Generated by VT. vt-library-release/v1
name: Release library

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pyproject version matches the release tag
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]

      - name: Test
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet build '.[test]'
          .venv/bin/python -m pytest --junit-xml test-results.xml -q

      - name: Build artifacts
        shell: bash
        run: |
          .venv/bin/python -m build --outdir artifacts
          cd artifacts && sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Published by VT from $GITHUB_SHA."
